spring.application.name=skillsphere

spring.datasource.url=jdbc:postgresql://localhost:5432/skillsphere_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/skillsphere
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/skillsphere/protocol/openid-connect/certs
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG

