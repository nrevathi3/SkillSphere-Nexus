server:
  port: 8090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:

          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_FIRST

          routes:

            - id: skill-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/skills/**

            - id: assessment-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/assessments/**

            - id: competency-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/competency/**

            - id: certification-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/certifications/**

            - id: compliance-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/compliance/**

            - id: learning-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/learning/**

            - id: career-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/career/**

management:
  endpoints:
    web:
      exposure:
        include: health,info